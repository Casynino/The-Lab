<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <!-- viewport-fit=cover lets the installed app use the whole screen, under
         the notch and the camera hole; the pages keep their own safe margins
         with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <!-- Hao Labs draws its own night. Saying so stops Samsung Internet,
         Huawei's browser and Chrome's "darken websites" repainting it into
         their own idea of dark — grey text on grey cards, which is the
         "forced" look on exactly the phones the reps carry. -->
    <meta name="color-scheme" content="dark" />
    <title>Hao Labs</title>
    <meta name="description" content="We keep Tanzania stocked." />

    <!-- Share preview (Open Graph — WhatsApp, Telegram, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hao Labs" />
    <meta property="og:title" content="Hao Labs" />
    <meta property="og:description" content="We keep Tanzania stocked." />
    <meta property="og:url" content="https://the-lab.vercel.app" />

    <!-- Share preview (Twitter / X) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hao Labs" />
    <meta name="twitter:description" content="We keep Tanzania stocked." />
    <!-- Put it on a home screen and it opens full screen, with no address
         bar: an icon on Android, Huawei and the desktop (the manifest), and on
         an iPhone the same through "Add to Home Screen". The launch pictures
         stop iOS opening the app on a white flash — one per screen size.
         All of it is made by docs/mockups/app_icons.py. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hao Labs" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

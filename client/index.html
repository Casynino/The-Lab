<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The browser-tab icon: the red mark large on the app's near-black tile.
         A real .ico too — browsers ask for /favicon.ico by name whatever the
         page says, and the site used to answer that with the web page itself.
         Made by docs/mockups/brand.py. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png" />
    <!-- viewport-fit=cover lets the installed app use the whole screen, under
         the notch and the camera hole; the pages keep their own safe margins
         with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <!-- ZELab draws its own night. Saying so stops Samsung Internet,
         Huawei's browser and Chrome's "darken websites" repainting it into
         their own idea of dark — grey text on grey cards, which is the
         "forced" look on exactly the phones the reps carry. -->
    <meta name="color-scheme" content="dark" />
    <title>ZELab</title>
    <meta name="description" content="We keep Tanzania stocked." />

    <!-- Share preview (Open Graph — WhatsApp, Telegram, Facebook, LinkedIn,
         iMessage, Slack). A link used to show a bare address: there was no
         image at all. The card is 1200x630, made by docs/mockups/brand.py, and
         the address must be ABSOLUTE — a crawler cannot resolve /brand/...
         against a page it is not looking at. It is www.zelab.site (the business
         became ZELab, 10 Nov 2026; the old hao-stock.vercel.app still serves the
         same site, so links shared before keep working). WhatsApp keeps a preview it has
         already drawn for days: a link shared before this shipped may need a
         new query (…/?v=2) to be fetched again. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZELab" />
    <meta property="og:title" content="ZELab" />
    <meta property="og:description" content="We keep Tanzania stocked." />
    <meta property="og:url" content="https://www.zelab.site/" />
    <meta property="og:image" content="https://www.zelab.site/brand/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ZELab — we keep Tanzania stocked." />

    <!-- Share preview (X / Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZELab" />
    <meta name="twitter:description" content="We keep Tanzania stocked." />
    <meta name="twitter:image" content="https://www.zelab.site/brand/og-image.jpg" />
    <meta name="twitter:image:alt" content="ZELab — we keep Tanzania stocked." />
    <!-- Put it on a home screen and it opens full screen, with no address
         bar: an icon on Android, Huawei and the desktop (the manifest), and on
         an iPhone the same through "Add to Home Screen". The launch pictures
         stop iOS opening the app on a white flash — one per screen size.
         All of it is made by docs/mockups/app_icons.py. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZELab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-startup-image" href="/brand/splash/440x956@3.png" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

      const STORY_END = 43.6;

      ft('#world', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0);

        const d = '#' + id + '-d';
        ft(d, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.15, ease: 'power2.out' }, t - 0.18);

      LIFTS.forEach(([id, a, b, s, dy]) => {
        const c = '#' + id + '-c';
        ft(c, { scale: 1, y: 0, boxShadow: '0 0px 0px rgba(0,0,0,0), 0 0 0 1px rgba(255,255,255,0)' },
          { scale: s, y: dy, boxShadow: '0 34px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.16)', duration: 0.45, ease: 'expo.out' }, a);
        ft(c, { scale: s, y: dy, boxShadow: '0 34px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.16)' },
          { scale: 1, y: 0, boxShadow: '0 0px 0px rgba(0,0,0,0), 0 0 0 1px rgba(255,255,255,0)', duration: 0.3, ease: 'power3.in' }, b - 0.32);
        ft('#dim', { opacity: 0 }, { opacity: 0.55, duration: 0.3, ease: 'power2.out' }, a);
        ft('#dim', { opacity: 0.55 }, { opacity: 0, duration: 0.28, ease: 'power2.in' }, b - 0.3);
      });

      // Chapters: the word rolls to the next one like a slot, the line under it arrives word by word
      ft('#word-win', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power2.out' }, CH[0]);
      CH.forEach((t, i) => {
        if (i > 0) {
          ft('#word-col', { y: -(i - 1) * 136 }, { y: -i * 136, duration: 0.5, ease: 'power3.inOut' }, t);
          ft('#word-col', { filter: 'blur(0px)' }, { filter: 'blur(6px)', duration: 0.25, ease: 'power2.in' }, t);
          ft('#word-col', { filter: 'blur(6px)' }, { filter: 'blur(0px)', duration: 0.25, ease: 'power2.out' }, t + 0.25);
          ft('#sheen', { x: -900 }, { x: 900, duration: 0.8, ease: 'power2.inOut' }, t);
        }
        ft('#ln' + i + ' .lw', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067, ease: 'power2.out' }, t + 0.2);
        const end = i + 1 < CH.length ? CH[i + 1] : STORY_END - 0.4;
        ft('#ln' + i + ' .lw', { opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(6px)', duration: 0.18, stagger: 0.03, ease: 'power2.in' }, end - 0.24);
        ft('#cam', { rotationY: i ? TILT[i - 1] : 0 }, { rotationY: TILT[i], duration: 0.9, ease: 'power2.inOut' }, t);
      });
      ft('#word-win', { opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power2.in' }, STORY_END - 0.62);

      // Payoff: the camera pushes in on "On its way"
      ft('#cam', { scale: 1, y: 0 }, { scale: 1.06, y: 0, duration: 0.6, ease: 'expo.out' }, 32.55);
      ft('#cam', { scale: 1.06, y: 0 }, { scale: 1, y: 0, duration: 0.5, ease: 'power2.inOut' }, 35.15);
      // Exit: the phone sinks away
      ft('#cam', { scale: 1, y: 0, opacity: 1 }, { scale: 0.92, y: 260, opacity: 0, duration: 0.5, ease: 'power2.in' }, STORY_END - 0.62);

      window.__timelines['story'] = tl;
    })();
  </script>
